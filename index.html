
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGPT AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <aside class="sidebar">
            <h2>🛡 CyberGPT AI</h2>
            <button id="new-chat">+ New Chat</button>
            <p>Your AI Cybersecurity Assistant</p>
        </aside>

        <main class="chat-area">

            <header>
                <h2>CyberGPT AI Assistant</h2>
                <span>Online</span>
            </header>

            <section class="messages" id="messages">
                <div class="welcome">
                    <h1>Welcome to CyberGPT AI</h1>
                    <p>Your intelligent cybersecurity assistant.</p>
                    <p>Ask me about cybersecurity, ethical hacking,
                    networking and SOC analysis.</p>
                </div>
            </section>

            <div class="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask CyberGPT anything..."
                >
                <button id="send-button">Send</button>
            </div>

            <footer>
                CyberGPT AI • Your Cybersecurity Assistant
            </footer>

        </main>

    </div>

    <script src="script.js"></script>
</body>
</html>
